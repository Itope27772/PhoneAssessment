name: Phone Assessment Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          contribution: 'temurin'
          cache: maven

      - name: Build and Run Test
        run: mvn clean test -Dheadless=true